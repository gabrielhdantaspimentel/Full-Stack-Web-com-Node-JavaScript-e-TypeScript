<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>

        body {
            font-size: 3rem;
            background-color: black;
            color: white;
            margin: 20px;
            padding: 0;
            /* border: solid 2px red; */
        }

        .caixa {
            background-color: white;
            color: black;
        }

        .grid {
            border: solid 2px yellowgreen;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            height: 90vh;
        }

        .item2 {
            grid-column: 2 / 4;
        }

        .item3 {
            grid-column: 1 /3;
        }

        .item4 {
            grid-column: 3 / 4;
            grid-row: 2 / 4;
        }

    </style>

</head>
<body>
    <div class="grid">
        <div class="item1 caixa">1</div>
        <div class="item2 caixa">2</div>
        <div class="item3 caixa">3</div>
        <div class="item4 caixa">4</div>
        <div class="item5 caixa">5</div>
        <div class="item6 caixa">6</div>
        <!-- <div class="item7 caixa">7</div>
        <div class="item8 caixa">8</div>
        <div class="item9 caixa">9</div> -->
    </div>
</body>
</html>
