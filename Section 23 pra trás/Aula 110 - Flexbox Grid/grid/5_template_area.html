<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>

        body {
            font-size: 1.2rem;
            background-color: black;
            color: white;
            margin: 20px;
            padding: 0;
            /* border: solid 1px red; */
        }

        .grid {
            border: 2px solid red;
            row-gap: 20px;
            column-gap: 20px;
            display: grid;


            

            grid-template-columns: 1fr; 
            /* grid-template-columns: repeat(2, 1fr);  */
            grid-template-areas: 
            'cabecalho'
            'navegacao'
            'principal'
            'rodape'
            ;
        }
        

        /* 
        Media = tipo de dispositivo
        Celular, tablet, notebook 
        0 até 600
        min-width: 600 até 1200
        min-width: 1200
        */
        @media (min-width: 600px) {
            .grid {
            grid-template-columns: 1fr 2fr; 
            grid-template-areas: 
            'cabecalho cabecalho'
            'navegacao principal'
            'rodape rodape'
            ;
        }
    }

    @media (min-width: 1200px) {
            .grid {
            grid-template-columns: 1fr 2fr; 
            grid-template-areas: 
            'cabecalho cabecalho'
            'navegacao principal'
            'navegacao rodape'
            ;
        }
    }

        header, nav, main, footer {
            border: 2px solid yellowgreen;
        }
        header {grid-area: cabecalho;}
        nav {grid-area: navegacao;}
        main {grid-area: principal;}                
        footer {grid-area: rodape;}

        

    </style>

</head>
<body>
    <div class="grid">
        <header>Cabeçalho</header>
        <nav>Menu de navegação</nav>
        <main>
            <h2>Conteúdo do sistema</h2>
            <p>
                Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maxime ut enim iste laudantium dolorum dolore
            </p>
        </main>
        <footer>Rodapé</footer>
    </div>
</body>
</html>
