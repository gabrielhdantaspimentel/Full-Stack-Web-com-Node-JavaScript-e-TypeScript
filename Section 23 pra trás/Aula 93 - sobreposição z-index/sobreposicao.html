        .caixa {
            background-color: purple;
            position: fixed;
            z-index: 0;
        }

        .destaque {
            position: relative;
            background-color: orange;
            bottom: 70px;
            left: 20px;
            text-align: center;
            width: 130px;
            padding: 10px;
            border-radius: 15px;
            z-index: 1;
            color: white;
        }

        .promocao{
            color: purple;
            background-color: white;
            position: relative;
            border: 1px dotted purple;
            text-align: center;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            width: 500px;
            padding: 15px;
            top: 20px;
            left: 90px;
        }
